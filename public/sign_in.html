<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In</title>

<link rel="stylesheet" href="./assets/css/log.css">
</head>

<body>

<div class="auth-page">
    <div class="auth-box">

        <h2>Sign In</h2>

        <form id="loginForm">
            
            <label>Email</label>
            <input type="email" id="loginEmail" name="identifier" placeholder="Enter Email" required>

            <label>Password</label>
            <div style="position:relative;">
                <input type="password" id="loginPassword" name="password" placeholder="Enter Password" required>
                <button type="button" id="toggleLoginPassword" style="position:absolute; right:8px; top:50%; transform:translateY(-50%); background:transparent; border:none; color:#94A3B8; cursor:pointer; display:flex; align-items:center;"></button>
            </div>

            <div id="loginError" style="display:none; color:#ef4444; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); border-radius:6px; padding:10px 12px; margin-top:4px; font-size:13px; text-align:center;"></div>

            <button type="submit" class="login-btn">Login</button>

        </form>

        <p class="switch">
            Don't have account?
            <a href="./sign_up.html">Sign Up</a>
        </p>

        <p class="switch">
            <a href="./index.html">← Back Home</a>
        </p>

    </div>



<script src="./assets/js/log.js"></script>
</body>
</html>
